[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peektodo"
version = "0.1.0"
description = "贴在屏幕右边缘的待办面板：鼠标贴边滑出，离开自动收回"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "ConstVain" }]
keywords = ["todo", "windows", "pyqt5", "markdown", "mubu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PyQt5>=5.15",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
peektodo = "peek_todo.app:main"

[project.urls]
Homepage = "https://github.com/ConstVain/PeekTodo"
Issues = "https://github.com/ConstVain/PeekTodo/issues"

[tool.setuptools]
packages = ["peek_todo", "peek_todo.sources", "peek_todo.ui"]

[tool.setuptools.package-data]
peek_todo = ["assets/*.png", "assets/*.ico", "assets/fonts/*.ttf", "assets/fonts/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
